<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Passport Hot Press</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="passport">
        <section class="left">
            <div class="card"></div>
            <div class="slots"><i></i><i></i><i></i><i></i></div>
            <div class="identity">
                <h1>EJ</h1>
                <p>PASSPORT HOT PRESS<br>WHERE HAVE U BEEN?</p>
            </div>
            <div class="pocket"></div>
            <div class="tools">
                <p class="eyebrow">CHOOSE YOUR IMPRESSION</p>
                <div id="choices" class="choices" aria-label="Stamp designs"></div>
                <div class="actions"><button id="clear">CLEAR ALL</button></div>
            </div>
        </section>
        <div class="spine" aria-hidden="true"></div>
        <section id="garden" aria-label="Passport stamp area">
            <div id="stamps"></div>
        </section>
    </main>
    <footer><span>CLICK TO HOT PRESS</span></footer>
    <script src="script.js"></script>
</body>

</html>
